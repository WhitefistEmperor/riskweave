# Render Blueprint for the public, READ-ONLY RiskWeave demo.
#
# Two free Docker web services:
#   riskweave-api  the FastAPI backend (Dockerfile)
#   riskweave      the analyst frontend (Dockerfile.frontend), which proxies /api
#                  to the backend
#
# Why "development" + auth "disabled": production mode deliberately refuses to
# run without real JWT login, and forbids the public demo. With auth disabled,
# every persisted-investigation endpoint answers 401 (uploads, runs and saved
# cases stay locked), while the synthetic /demo replay stays readable. Nothing
# here enables the development identity, which must never be public.
#
# Free instances sleep when idle (slow first request) and their disk is wiped
# on restart, which is fine for a demo that stores nothing.
services:
  - type: web
    name: riskweave-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Uses the image's own start command. The database is deliberately not
    # migrated: the /demo replay reads bundled synthetic results and never
    # touches it, and every route that would use it is locked (401) here. The
    # one visible effect is that /api/v1/ready reports NOT_READY.
    envVars:
      - key: PORT
        value: "8000"
      - key: RINGSENTINEL_ENVIRONMENT
        value: development
      - key: RINGSENTINEL_AUTH_MODE
        value: disabled
      - key: RINGSENTINEL_DEMO_ENABLED
        value: "true"
      - key: RINGSENTINEL_LLM_PROVIDER
        value: deterministic
      - key: RINGSENTINEL_TRUSTED_HOSTS
        value: '["riskweave-api.onrender.com","localhost","127.0.0.1"]'
      - key: RINGSENTINEL_FRONTEND_ORIGINS
        value: '["https://riskweave.onrender.com"]'
      # Render passes this to the Docker build (the Dockerfile's ARG): the demo
      # model is trained once at build time and shipped in the image, because
      # retraining on a woken free instance took about three minutes.
      - key: PREBUILD_RUNTIME
        value: "true"

  - type: web
    name: riskweave
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: PORT
        value: "5173"
      # Used at build time (the Dockerfile's ARG) and at start.
      - key: RINGSENTINEL_API_PROXY_TARGET
        value: https://riskweave-api.onrender.com
      - key: RINGSENTINEL_PUBLIC_DEMO
        value: "true"
      # Sent from the visitor's browser while the API is asleep: Render only
      # wakes a free service for requests arriving from the internet, not for
      # ones forwarded from inside its network by this frontend. Pointing it at
      # /api/overview also starts the slow first model build straight away.
      - key: RINGSENTINEL_DEMO_WAKE_URL
        value: https://riskweave-api.onrender.com/api/overview
