name: RingSentinel validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - name: Migrate a fresh database, then verify an idempotent second upgrade
        env:
          RINGSENTINEL_DATABASE_URL: sqlite:///./work/ci-migrations.db
        run: |
          uv run --no-sync ringsentinel-migrate
          uv run --no-sync ringsentinel-migrate
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RINGSENTINEL_ENVIRONMENT: test
      RINGSENTINEL_AUTH_MODE: development
      RINGSENTINEL_DATABASE_URL: sqlite:///./work/ci-browser.db
      RINGSENTINEL_STORAGE_ROOT: work/ci-browser-storage
      RINGSENTINEL_LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ringsentinel-migrate
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start real backend and production frontend
        shell: bash
        run: |
          uv run --no-sync uvicorn ringsentinel.api.app:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log > work/backend.log 2>&1 &
          (cd frontend && npm start) > work/frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready && curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: npm test
        working-directory: frontend
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            work/*.log
            frontend/test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Ephemeral CI-only database credential, never a deployment secret.
      RINGSENTINEL_DB_PASSWORD: ci-only-ephemeral-database
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          python-version: "3.13"
          enable-cache: true
      - name: Validate and build local-only stack
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up --wait --wait-timeout 180
      - name: Check health, readiness, and frontend
        run: |
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:8000/api/v1/ready
          curl --fail http://127.0.0.1:5173/ > /dev/null
      - name: Run a real persisted investigation through the container API
        run: uv run --locked --extra dev python scripts/smoke_platform.py --base-url http://127.0.0.1:8000
      - name: Preserve stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop this ephemeral CI stack
        if: always()
        run: docker compose down
