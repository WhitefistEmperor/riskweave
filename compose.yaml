name: ringsentinel-local

x-backend-environment: &backend-environment
  # Explicit single-user local mode. This is NOT a production auth deployment.
  RINGSENTINEL_ENVIRONMENT: development
  RINGSENTINEL_AUTH_MODE: development
  RINGSENTINEL_DEVELOPMENT_USER_ID: local-analyst
  RINGSENTINEL_DEMO_ENABLED: "true"
  RINGSENTINEL_DATABASE_URL: postgresql+psycopg://ringsentinel:${RINGSENTINEL_DB_PASSWORD:?Set RINGSENTINEL_DB_PASSWORD for the local database}@postgres:5432/ringsentinel
  RINGSENTINEL_STORAGE_ROOT: /app/work/storage
  RINGSENTINEL_FRONTEND_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
  RINGSENTINEL_LLM_PROVIDER: deterministic
  RINGSENTINEL_ANALYSIS_TIMEOUT_SECONDS: "300"

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ringsentinel
      POSTGRES_DB: ringsentinel
      POSTGRES_PASSWORD: ${RINGSENTINEL_DB_PASSWORD:?Set RINGSENTINEL_DB_PASSWORD for the local database}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringsentinel -d ringsentinel"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No host database port. Only compose-network services can reach it.

  migrate:
    image: ringsentinel-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${RINGSENTINEL_BUILD_COMMIT:-unknown}
    environment: *backend-environment
    command: ["ringsentinel-migrate"]
    volumes:
      - artifacts:/app/work
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  backend:
    image: ringsentinel-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${RINGSENTINEL_BUILD_COMMIT:-unknown}
    environment: *backend-environment
    volumes:
      - artifacts:/app/work
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  frontend:
    image: ringsentinel-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        RINGSENTINEL_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    stop_grace_period: 20s

volumes:
  database:
  artifacts:
