[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ringsentinel"
version = "0.2.0"
description = "Temporal network intelligence for coordinated payment abuse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ringsentinel-generate = "ringsentinel.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ringsentinel"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
