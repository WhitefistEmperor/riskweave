[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ringsentinel"
version = "0.4.0"
description = "Temporal network intelligence for coordinated payment abuse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyjwt[crypto]>=2.13,<3",
  "alembic>=1.16,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "fastapi>=0.116,<1",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ringsentinel-generate = "ringsentinel.generate:main"
ringsentinel-phase3 = "ringsentinel.experiments.phase3:main"
ringsentinel-api = "ringsentinel.api.app:main"
ringsentinel-migrate = "ringsentinel.platform.database:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ringsentinel"]

[tool.hatch.build.targets.wheel.force-include]
"results/phase3/phase3_results.json" = "ringsentinel/resources/phase3_results.json"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "results", "schemas", "scripts", "pyproject.toml", "uv.lock", "README.md", "LICENSE", ".env.example"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
